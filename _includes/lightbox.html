<!-- Image Zoom & Lightbox Modal (Modern Web Guidance compliant) -->
<dialog id="image-lightbox" class="image-lightbox" closedby="any" aria-label="Image preview">
  <div class="lightbox-toolbar" role="toolbar" aria-label="Image zoom controls">
    <div class="lightbox-controls">
      <button type="button" class="lightbox-btn" id="lightbox-zoom-out" aria-label="Zoom out" title="Zoom out (-)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <span class="lightbox-zoom-level" id="lightbox-zoom-level" aria-live="polite">100%</span>
      <button type="button" class="lightbox-btn" id="lightbox-zoom-in" aria-label="Zoom in" title="Zoom in (+)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button type="button" class="lightbox-btn" id="lightbox-zoom-reset" aria-label="Reset zoom" title="Reset zoom (1:1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
      <div class="lightbox-divider" aria-hidden="true"></div>
      <button type="button" class="lightbox-btn lightbox-btn-close" id="lightbox-close" aria-label="Close image preview" title="Close (Esc)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <div class="lightbox-stage" id="lightbox-stage">
    <img id="lightbox-img" class="lightbox-img" src="" alt="" draggable="false">
  </div>

  <div class="lightbox-footer" id="lightbox-footer">
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <div class="lightbox-hint">Click or scroll to zoom &bull; Drag to pan &bull; Press Esc to close</div>
  </div>
</dialog>
